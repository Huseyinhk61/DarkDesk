name: Microsoft Store review package
on:
  push:
    branches: [main]
    paths:
      - 'build/store-identity.json'
      - 'build/appx/**'
      - 'public/icon.svg'
      - 'scripts/generate-store-assets.mjs'
      - 'electron-builder.store.cjs'
      - 'scripts/store-config.cjs'
      - 'scripts/verify-store-package.ps1'
      - 'scripts/create-store-archive.ps1'
      - 'scripts/verify-store-download.py'
      - '.github/workflows/store.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      identityName:
        description: Optional override for Package Identity Name (supply all three overrides)
        required: false
      publisher:
        description: Optional exact Publisher (CN=...) override
        required: false
      publisherDisplayName:
        description: Optional Publisher Display Name override
        required: false
permissions:
  contents: read
jobs:
  store-review:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Write optional identity overrides as data
        if: inputs.identityName != '' || inputs.publisher != '' || inputs.publisherDisplayName != ''
        env:
          STORE_IDENTITY: ${{ inputs.identityName }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_DISPLAY: ${{ inputs.publisherDisplayName }}
        run: node -e "require('fs').writeFileSync('build/store-identity.local.json', JSON.stringify({identityName:process.env.STORE_IDENTITY,publisher:process.env.STORE_PUBLISHER,publisherDisplayName:process.env.STORE_DISPLAY,displayName:'DarkDesk'}))"
      - run: npm ci
      - run: npm run check:store
      - run: npm run test:ci
      - run: npm run dist:store
      - name: Verify packaged identity, capabilities and checksum
        run: ./scripts/verify-store-package.ps1
      - name: Create and extract-test a standard Store ZIP
        run: ./scripts/create-store-archive.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DarkDesk-Store-Review
          path: |
            release/store/*.appx
            release/store/SHA256SUMS-Store.txt
            release/store/store-validation.json
            release/store/README-STORE.txt
          if-no-files-found: error
          compression-level: 0
      - name: Publish direct Store downloads separately from app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="store-v$version"
          assets=("release/store/DarkDesk-Store-$version-x64.appx" "release/store/DarkDesk-Store-Submission-$version-x64.zip" "release/store/DarkDesk-Store-Submission-$version-x64.zip.sha256" "release/store/SHA256SUMS-Store.txt" "release/store/store-validation.json" "release/store/README-STORE.txt")
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/darkdesk-store-release-state"; then
            if [ "$(cat "$RUNNER_TEMP/darkdesk-store-release-state")" = "true" ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --prerelease --latest=false
            else
              echo "Store submission $tag already published; existing downloads are preserved."
            fi
          else
            gh release create "$tag" "${assets[@]}" --target "$RELEASE_SHA" --title "DarkDesk $version - Store submission" --notes-file release/store/README-STORE.txt --draft --prerelease
            gh release edit "$tag" --draft=false --prerelease --latest=false
          fi

      - name: Independently download and verify public ZIP and AppX
        env:
          DARKDESK_EXPECTED_STORE_SHA: ${{ github.sha }}
        run: python scripts/verify-store-download.py --output release/store/public-check
      - uses: actions/upload-artifact@v4
        with:
          name: DarkDesk-Store-Public-Download-Proof
          path: release/store/public-check/store-public-download-verification.json
          if-no-files-found: error
