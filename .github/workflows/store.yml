name: Microsoft Store review package
on:
  push:
    branches: [main]
    paths:
      - 'build/store-identity.json'
      - 'build/appx/**'
      - 'public/icon.svg'
      - 'scripts/generate-store-assets.mjs'
      - 'electron-builder.store.cjs'
      - 'scripts/store-config.cjs'
      - 'scripts/verify-store-package.ps1'
      - '.github/workflows/store.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      identityName:
        description: Optional override for Package Identity Name (supply all three overrides)
        required: false
      publisher:
        description: Optional exact Publisher (CN=...) override
        required: false
      publisherDisplayName:
        description: Optional Publisher Display Name override
        required: false
permissions:
  contents: read
jobs:
  store-review:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Write optional identity overrides as data
        if: inputs.identityName != '' || inputs.publisher != '' || inputs.publisherDisplayName != ''
        env:
          STORE_IDENTITY: ${{ inputs.identityName }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_DISPLAY: ${{ inputs.publisherDisplayName }}
        run: node -e "require('fs').writeFileSync('build/store-identity.local.json', JSON.stringify({identityName:process.env.STORE_IDENTITY,publisher:process.env.STORE_PUBLISHER,publisherDisplayName:process.env.STORE_DISPLAY,displayName:'DarkDesk'}))"
      - run: npm ci
      - run: npm run check:store
      - run: npm run test:ci
      - run: npm run dist:store
      - name: Verify packaged identity, capabilities and checksum
        run: ./scripts/verify-store-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DarkDesk-Store-Review
          path: |
            release/store/*.appx
            release/store/SHA256SUMS-Store.txt
            release/store/store-validation.json
          if-no-files-found: error
