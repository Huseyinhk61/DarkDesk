name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected stable semantic version' }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF -ne "v$version") { throw 'Tag must match package version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - run: npm run test:desktop
      - name: Build setup and portable EXE
        run: npm run dist:win -- --publish never
      - run: node scripts/verify-windows-release.cjs
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @("release/DarkDesk-Setup-$version.exe", "release/DarkDesk-Portable-$version.exe", "release/DarkDesk-Setup-$version.exe.blockmap", "release/latest.yml")
          Get-Item $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DarkDesk-Windows
          path: |
            release/DarkDesk-Setup-${{ steps.version.outputs.version }}.exe
            release/DarkDesk-Portable-${{ steps.version.outputs.version }}.exe
            release/DarkDesk-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DarkDesk-Windows
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="v$RELEASE_VERSION"
          assets=("release/DarkDesk-Setup-$RELEASE_VERSION.exe" "release/DarkDesk-Portable-$RELEASE_VERSION.exe" "release/DarkDesk-Setup-$RELEASE_VERSION.exe.blockmap" "release/latest.yml" "release/SHA256SUMS.txt")
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/darkdesk-release-state; then
            if [ "$(cat /tmp/darkdesk-release-state)" = "true" ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --notes-file .github/RELEASE_NOTES.md --draft=false --latest
            else
              echo "Release $tag already published. Bump package.json for another update."
            fi
          else
            gh release create "$tag" "${assets[@]}" --target "$RELEASE_SHA" --title "DarkDesk $tag" --notes-file .github/RELEASE_NOTES.md --draft
            gh release edit "$tag" --draft=false --latest
          fi
